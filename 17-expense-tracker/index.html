
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">

        <header>
            <div class="icon">₱</div>
            <h1>Expense Tracker</h1>
            <p>Monitor and manage your daily expenses.</p>
        </header>

        <section class="form-section">

            <label for="desc">Expense Description</label>
            <input
                type="text"
                id="desc"
                placeholder="Enter expense name"
                maxlength="60"
            >

            <label for="amount">Amount (₱)</label>
            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="0.01"
                step="0.01"
            >

            <button onclick="addExpense()">Add Expense</button>

        </section>

        <section class="expense-section">

            <div class="section-heading">
                <h2>Expense History</h2>
                <button class="clear-btn" onclick="clearExpenses()">
                    Clear All
                </button>
            </div>

            <ul id="list">
                <li class="empty-message">No expenses recorded yet.</li>
            </ul>

        </section>

        <section class="total-box">
            <div>
                <p>Total Expenses</p>
                <h2 id="total">₱0.00</h2>
            </div>
            <div class="total-icon">₱</div>
        </section>

        <footer>
            <p>Expense Tracker Management System</p>
        </footer>

    </main>

</body>
</html>
