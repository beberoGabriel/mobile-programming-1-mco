
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <div class="icon">＋</div>

        <h1>Simple Calculator</h1>
        <p class="subtitle">Perform basic mathematical operations.</p>

        <label for="a">First Number</label>
        <input type="number" id="a" placeholder="Enter first number" step="any">

        <label for="op">Select Operation</label>
        <select id="op">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (×)</option>
            <option value="/">Division (÷)</option>
        </select>

        <label for="b">Second Number</label>
        <input type="number" id="b" placeholder="Enter second number" step="any">

        <button onclick="calculate()">Calculate</button>
        <button class="clear-btn" onclick="clearCalculator()">Clear</button>

        <div class="result-box">
            <p>Calculation Result</p>
            <h2 id="result">Your answer will appear here</h2>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
