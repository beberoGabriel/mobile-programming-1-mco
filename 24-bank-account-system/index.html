
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <header>
            <div class="bank-icon">🏦</div>
            <h1>Bank Account System</h1>
            <p>Manage your sample account balance.</p>
        </header>

        <section class="balance-card">
            <p>Available Balance</p>
            <h2 id="balance">₱1,000.00</h2>
            <span>Demo Account</span>
        </section>

        <section class="transaction-section">
            <h2>Make a Transaction</h2>

            <label for="amount">Enter Amount (₱)</label>
            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="0.01"
                step="0.01"
            >

            <div class="buttons">
                <button id="depositButton">Deposit</button>
                <button id="withdrawButton" class="withdraw-button">
                    Withdraw
                </button>
            </div>

            <button id="resetButton" class="reset-button">
                Reset Demo Account
            </button>

            <p id="message" aria-live="polite"></p>
        </section>

        <section class="history-section">
            <h2>Transaction History</h2>
            <ul id="history"></ul>
            <p id="empty">No transactions yet.</p>
        </section>

        <footer>
            <p>Bank Account System | Educational Project</p>
            <p>This is a sample simulation, not a real banking service.</p>
        </footer>
    </main>

</body>
</html>
