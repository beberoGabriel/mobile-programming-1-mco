
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <p class="subtitle">BOOKING MANAGEMENT</p>
            <h1>Online Booking System</h1>
            <p class="description">Book your preferred service easily.</p>
        </header>

        <section class="booking-card">
            <h2>Create a Booking</h2>

            <form id="bookingForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label for="date">Booking Date</label>
                <input type="date" id="date" required>

                <label for="service">Select Service</label>
                <select id="service" required>
                    <option value="Hotel Room">Hotel Room</option>
                    <option value="Boat Trip">Boat Trip</option>
                    <option value="Tour">Tour</option>
                </select>

                <button type="submit">Book Now</button>
            </form>
        </section>

        <section class="booking-list">
            <div class="list-header">
                <h2>My Bookings</h2>
                <span id="bookingCount">0 Bookings</span>
            </div>

            <ul id="list"></ul>

            <p id="emptyMessage">No bookings yet. Create your first booking!</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
