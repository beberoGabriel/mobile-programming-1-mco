
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <header>
            <div class="weather-icon">🌤️</div>
            <h1>Weather Dashboard</h1>
            <p>Check sample weather information by city.</p>
        </header>

        <section class="search-section">
            <input
                type="text"
                id="city"
                placeholder="Enter city name (e.g. Manila)"
                autocomplete="off"
            >

            <button id="searchButton">Search</button>
            <button id="clearButton" class="clear-button">Clear</button>

            <p id="message" aria-live="polite"></p>
        </section>

        <section id="result" class="weather-result" aria-live="polite">
            <div class="placeholder">
                <span>🌍</span>
                <p>Search for a city to see its sample weather.</p>
            </div>
        </section>

        <section class="available-cities">
            <h2>Available Cities</h2>
            <div class="city-tags">
                <span>Manila</span>
                <span>Cebu</span>
                <span>Davao</span>
            </div>
        </section>

        <footer>
            <p>Sample Weather App | Educational Project</p>
        </footer>
    </main>

</body>
</html>
