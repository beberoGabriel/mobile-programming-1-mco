
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <header>
            <h1>My To-Do List</h1>
            <p>Organize your tasks and stay productive.</p>
        </header>

        <section class="task-form">
            <input type="text" id="task" placeholder="Enter a new task">
            <button id="addButton">Add Task</button>
            <p id="message" aria-live="polite"></p>
        </section>

        <section class="statistics">
            <div class="stat-card">
                <span id="total">0</span>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <span id="pending">0</span>
                <p>Pending</p>
            </div>

            <div class="stat-card">
                <span id="completed">0</span>
                <p>Completed</p>
            </div>
        </section>

        <section class="tasks-section">
            <h2>My Tasks</h2>

            <input type="search" id="search" placeholder="Search tasks...">

            <div class="filters">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="pending">Pending</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>

            <ul id="list"></ul>
            <p id="empty">No tasks yet. Add your first task!</p>
        </section>
    </main>

</body>
</html>
